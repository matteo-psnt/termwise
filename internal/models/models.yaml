providers:
  anthropic:
    # Haiku is the default: termwise's turns are short command lookups, where
    # latency and cost matter more than depth. Every current model thinks
    # adaptively and takes effort low/medium/high/xhigh/max.
    default_model: claude-haiku-5-5
    models:
      - id: claude-haiku-5-5
        name: Claude Haiku 5.5
        context: 1000000
        input_price: 0.10
        output_price: 0.50
        supports_tools: true
        supports_thinking: true
      - id: claude-sonnet-5-5
        name: Claude Sonnet 5.5
        context: 1000000
        input_price: 2.00
        output_price: 10.00
        supports_tools: true
        supports_thinking: true
      - id: claude-opus-5-5
        name: Claude Opus 5.5
        context: 1000000
        input_price: 4.00
        output_price: 20.00
        supports_tools: true
        supports_thinking: true
      - id: claude-fable-5-1
        name: Claude Fable 5.1
        context: 1000000
        input_price: 10.00
        output_price: 50.00
        supports_tools: true
        supports_thinking: true
      - id: claude-sonnet-4-6
        name: Claude Sonnet 4.6
        context: 1000000
        input_price: 3.00
        output_price: 15.00
        supports_tools: true
        supports_thinking: true
      - id: claude-opus-4-6
        name: Claude Opus 4.6
        context: 1000000
        input_price: 5.00
        output_price: 25.00
        supports_tools: true
        supports_thinking: true
      # Haiku 4.5 rejects the effort parameter, so no supports_thinking. Both
      # spellings are listed because earlier termwise defaults wrote the
      # dated ID into configs.
      - id: claude-haiku-4-5
        name: Claude Haiku 4.5
        context: 200000
        input_price: 1.00
        output_price: 5.00
        supports_tools: true
      - id: claude-haiku-4-5-20251001
        name: Claude Haiku 4.5
        context: 200000
        input_price: 1.00
        output_price: 5.00
        supports_tools: true

