# termwise built-in allow-list
# Commands matching these rules are auto-approved without user confirmation.
# Shell metacharacters (| ; & > < ` $() etc.) always trigger approval.
#
# Format per entry:
#   cmd: <executable basename>              (required)
#   allow_subs: [sub1, sub2, ...]          (optional — first positional arg must be in list)
#   block_flags: [-f1, --flag2, ...]       (optional — denied if any of these appear)

rules:

  # ── File system inspection ──────────────────────────────────────────────────
  - cmd: ls
  - cmd: ll
  - cmd: la
  - cmd: lsd
  - cmd: eza
  - cmd: tree
    block_flags: [-o]
  - cmd: stat
  - cmd: file
  - cmd: du
  - cmd: df
  - cmd: cd
  - cmd: lsof
  - cmd: find
    block_flags: [-execdir, -ok, -okdir, -delete, -fprint, -fprint0, -fprintf, -fls]

  # ── File reading ────────────────────────────────────────────────────────────
  - cmd: cat
  - cmd: bat
    block_flags: [--pager]
  - cmd: head
  - cmd: tail
  - cmd: less
    block_flags: [-o, -O]
  - cmd: more
  - cmd: wc
  - cmd: strings
  - cmd: xxd
    block_flags: [-r]
  - cmd: od

  # ── Text search ─────────────────────────────────────────────────────────────
  - cmd: grep
  - cmd: rg
    block_flags: [--pre]
  - cmd: ag
    block_flags: [--pager]
  - cmd: ack
    block_flags: [--pager]
  - cmd: fd
    block_flags: [-x, --exec, -X, --exec-batch]

  # ── Text processing ──────────────────────────────────────────────────────────
  - cmd: sort
    block_flags: [-o, --output]
  - cmd: uniq
  - cmd: cut
  - cmd: tr
  - cmd: diff
    block_flags: [--output]
  - cmd: colordiff
  - cmd: delta
    block_flags: [--pager]
  - cmd: comm
  - cmd: join
  - cmd: paste
  - cmd: column
  - cmd: expand
  - cmd: fold
  - cmd: fmt

  # ── Data / serialisation tools ───────────────────────────────────────────────
  - cmd: jq
  - cmd: yq
    block_flags: [-i, --inplace]
  - cmd: tomlq
  - cmd: dasel
  - cmd: fx

  # ── System info ─────────────────────────────────────────────────────────────
  - cmd: pwd
  - cmd: which
  - cmd: whereis
  - cmd: type
  - cmd: echo
  - cmd: printf
  - cmd: date
  - cmd: uname
  - cmd: hostname
  - cmd: whoami
  - cmd: id
  - cmd: uptime
  - cmd: printenv
  - cmd: locale
  - cmd: ulimit
  - cmd: sysctl
    block_flags: [-w, -p, --load, --system]
  - cmd: ps
  - cmd: pgrep
  - cmd: top
  - cmd: htop
  - cmd: btop
  - cmd: nvidia-smi

  # ── Network inspection ──────────────────────────────────────────
  - cmd: dig
  - cmd: nslookup
  - cmd: host
  - cmd: ping
    block_flags: [-f, --flood]
  - cmd: traceroute
  - cmd: netstat
  - cmd: ss

  # ── Git ─────────────────────────────────────────────────────────────────────
  - cmd: git
    block_flags: [-c, --config-env]
    allow_subs:
      - status
      - log
      - diff
      - show
      - blame
      - describe
      - shortlog
      - rev-parse
      - ls-files
      - ls-tree
      - cat-file
      - help
      - version

  # ── Go ──────────────────────────────────────────────────────────────────────
  - cmd: go
    allow_subs:
      - list
      - env
      - version
      - doc
      - vet

  # ── Rust / Cargo ────────────────────────────────────────────────────────────
  - cmd: cargo
    allow_subs:
      - metadata
      - tree
      - version
      - help

  # ── Node ecosystem ───────────────────────────────────────────────────────────
  - cmd: npm
    allow_subs: [list, ls, info, show, outdated, view]
  - cmd: pnpm
    allow_subs: [list, ls, info, outdated, audit, why]
    block_flags: [--fix]
  - cmd: yarn
    allow_subs: [list, info, outdated, why, check, licenses]

  # ── Python package tools ─────────────────────────────────────────────────────
  - cmd: pip
    allow_subs: [list, show, freeze, check, inspect, index]
  - cmd: pip3
    allow_subs: [list, show, freeze, check, inspect, index]
  - cmd: uv
    allow_subs: [tree]
  - cmd: poetry
    allow_subs: [show, check, version, export]
    block_flags: [-o, --output]
  - cmd: ruff
    allow_subs: [check, --version]

  # ── Ruby / Bundler ───────────────────────────────────────────────────────────
  - cmd: bundle
    allow_subs: [list, show, check, outdated, version, info]
  - cmd: gem
    allow_subs: [list, info, outdated, contents, dependency, search, spec]

  # ── Docker / container tools ────────────────────────────────────────────────
  - cmd: docker
    allow_subs:
      - ps
      - images
      - logs
      - inspect
      - stats
      - top
      - version
      - info
      - diff
      - port
      - history
  - cmd: docker-compose
    allow_subs: [ps, logs, config, version, images, top]
  - cmd: podman
    allow_subs: [ps, images, logs, inspect, stats, version, info, diff, history]

  # ── Kubernetes ──────────────────────────────────────────────────────────────
  - cmd: kubectl
    allow_subs:
      - get
      - describe
      - logs
      - top
      - version
      - cluster-info
      - explain
      - api-resources
      - api-versions
  - cmd: helm
    allow_subs: [list, status, history, get, show, version, env, search]

  # ── GitHub CLI ──────────────────────────────────────────────────────────────
  - cmd: gh
    allow_subs: [version, --version]

  # ── Package managers ─────────────────────────────────────────────
  - cmd: brew
    allow_subs: [list, info, outdated, search, deps, uses, doctor, config, --version]
  - cmd: apt
    allow_subs: [list, show, search, depends, rdepends, --version]
  - cmd: dpkg
    allow_subs: [-l, -s, -L, -S, --list, --status, --listfiles, --search]
  - cmd: rpm
    allow_subs: [-q, -qi, -ql, -qa, --query]
  - cmd: pacman
    allow_subs: [-Q, -Qi, -Ql, -Qs, -Si, -Ss, --query, --sync]
