name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The TUI reads terminal capabilities and the allowlist resolves real paths,
    # so the suite is worth running on both platforms termwise targets.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Same gate lefthook runs on commit, enforced for contributors who do not
      # have the hooks installed.
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, and a v2 line: the action's "latest" resolves to a v1
          # build of golangci-lint that cannot read a version:"2" config, and
          # refuses a go.mod targeting a newer Go than it was built with.
          version: v2.13.2
