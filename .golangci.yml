version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - nolintlint
    - revive
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - nilerr
    - wastedassign
    - copyloopvar
    - gocritic
    - unconvert
    - unparam
    - misspell

  settings:
    gocyclo:
      min-complexity: 25
    nolintlint:
      require-explanation: true
      require-specific: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: early-return
        - name: superfluous-else
        - name: indent-error-flow
        - name: error-return
        - name: error-naming
        - name: errorf
        - name: redefines-builtin-id
        - name: time-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: unreachable-code

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/matteo-psnt/termwise
