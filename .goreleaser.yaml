# Release config. `git tag v0.1.0 && git push --tags` builds the binaries and
# publishes the Homebrew formula.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: termwise
    main: ./cmd/termwise
    binary: termwise
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    # Keep the conventional <name>_<os>_<arch> layout Homebrew and curl scripts expect.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

brews:
  # A formula rather than a cask: casks are macOS-only, and termwise builds for
  # Linux too. goreleaser marks this deprecated in favour of homebrew_casks —
  # accepted knowingly, because a cask would leave every Linux user without a
  # brew install for no gain on macOS.
  - name: termwise
    # Requires a github.com/matteo-psnt/homebrew-tap repository. Without
    # HOMEBREW_TAP_GITHUB_TOKEN the release still publishes binaries; only this
    # step is skipped.
    repository:
      owner: matteo-psnt
      name: homebrew-tap
    homepage: https://github.com/matteo-psnt/termwise
    description: A terminal assistant for command generation and quick answers
    license: MIT
    test: |
      system "#{bin}/termwise", "--version"
    caveats: |
      Add the shell integration to your rc file:
        eval "$(termwise init zsh)"     # ~/.zshrc
        eval "$(termwise init bash)"    # ~/.bashrc
        termwise init fish | source     # ~/.config/fish/config.fish

      Then choose a provider:
        tw config
